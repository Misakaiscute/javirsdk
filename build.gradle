plugins {
    id 'eclipse'
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.35.0'
}

group = 'dev.misakaiscute'
version = '0.0.1'

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(
        project.group.toString(),
        project.name,
        project.version.toString()
    )

    pom {
        name = 'Javirsdk'
        description = 'iRacing sdk wrapper and extension for the JVM'
        url = 'https://github.com/Misakaiscute/javirsdk'

        licenses {
            license {
                name = 'Apache License, 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'misakaiscute'
                name = 'Hunor Horchy'
            }
        }

        scm {
            connection = 'scm:git:https://github.com/Misakaiscute/javirsdk.git'
            url = 'https://github.com/Misakaiscute/javirsdk'
            tag = 'HEAD'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    create('utils') {
        java.srcDir('src/utils/java')
        runtimeClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(libs.jna)
    implementation(libs.jna.platform)
    implementation(libs.jackson.core)
    implementation(libs.jackson.databind)
    implementation(libs.jackson.annotations)
    implementation(libs.jackson.ext.yaml)
    testImplementation(platform(libs.junit))
    testImplementation(libs.jupiter)
    testRuntimeOnly(libs.junit.platform)
}

configurations {
    utilsImplementation.extendsFrom(implementation)
}

test {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}

tasks.register('runTestMain', JavaExec) {
    group = 'Execution'
    description = "Run a manual testing environment."
    
    classpath = sourceSets.test.runtimeClasspath
    
    mainClass = "Main"
}

tasks.register('scoutVariables', JavaExec) {
    group = 'custom'
    description = 'Scouting variables and transforming them into source code'

    dependsOn 'classes'
    classpath = sourceSets.utils.runtimeClasspath
    mainClass = 'javirsdk.variable.JavirsdkTelemetryVariableScouter'

    args = ['--flag', 'value']
    standardInput = System.in
    standardOutput = System.out
}

tasks.register('registerSessionGroup', JavaExec) {
    group = 'custom'
    description =
        """Registers a new session group to another session group.
        Takes in the name of the new group, and optionally the root
        to add it to. If no root specified, Uses the default group
        (SessionRoot)."""

    dependsOn 'classes'
    classpath = sourceSets.utils.runtimeClasspath
    mainClass = 'javirsdk.variable.JavirsdkSessionGroupRegister'

    args = ['--flag', 'value']
    standardInput = System.in
    standardOutput = System.out
}

tasks.register('registerSessionVariable', JavaExec) {
    group = 'custom'
    description =
        """Registers a variable to be added to to a session group.
        Takes in the name of the variable (as it appears in the
        iRacing session string), the type of the variable, and the
        session group to add it to."""

    dependsOn 'classes'
    classpath = sourceSets.utils.runtimeClasspath
    mainClass = 'javirsdk.variable.JavirsdkSessionVariableRegister'

    args = ['--flag', 'value']
    standardInput = System.in
    standardOutput = System.out
}
