[versions]
jna = "5.19.1"
junit = "5.10.0"
jackson-core = "2.22.3"
jackson-ext-yaml = "2.14.2"

kotlin-jvm = "2.2.20"

[libraries]
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
junit = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-platform = { group = "org.junit.platform", name = "junit-platform-launcher" }
jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
jackson-core = { group = "com.fasterxml.jackson.core", name = "jackson-core", version.ref = "jackson-core" }
jackson-ext-yaml = { group = "com.fasterxml.jackson.dataformat", name = "jackson-dataformat-yaml", version.ref = "jackson-ext-yaml" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin-jvm" }
